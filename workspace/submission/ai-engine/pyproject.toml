[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-event-ai"
version = "0.1.0"
description = "Plugin-based visual event analysis service for the Makerverse/livestream-rs project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
media = ["opencv-python-headless>=4.9"]
model = ["onnxruntime>=1.17"]
pose = ["ultralytics>=8.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
visual-event-ai = "visual_event_ai.app:run"
